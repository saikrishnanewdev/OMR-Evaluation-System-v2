# Build the Windows .exe on a Windows runner.
# PyInstaller cannot cross-compile a Windows .exe from Linux, so the
# build runs here on windows-latest. Triggered manually, or on every
# push to main that touches the app code.
name: Build Windows .exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "omr_evaluator.spec"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run dynamic-detection tests
        run: python -m pytest tests/test_dynamic_detection.py tests/test_license_manager.py -v
      - name: Build .exe with PyInstaller
        run: pyinstaller omr_evaluator.spec
      - name: Upload .exe folder
        uses: actions/upload-artifact@v4
        with:
          name: OMREvaluationSystem-windows
          path: dist/OMREvaluationSystem
          if-no-files-found: error
